  return '<s class="price-was">'+regular.replace(/</g,'')+'</s> <span class="price-now">'+prefix+saleMoney(saleAmt(n,salePct))+'</span>';
}
function setPriceNode(node,regular,id,before){
  var html=priceHtml(regular,id);
  if(html){node.innerHTML=(before||'')+html;}
  else{node.textContent=(before||'')+regular;}
}
if(saleTest()){saleOn=true;salePct=15;}

function send(m){if(!inFrame)return;m.source=NS;try{window.parent.postMessage(m,"*");}catch(e){}}

function go(path){ /* site page: page code navigates (Wix same-tab); without page code, a normal top-level link */
  if(inFrame&&connected){send({type:"navigate",url:path});return;}
  try{window.top.location.href=SITE+path;}catch(e){window.open(SITE+path,"_top");}
}
function navLink(n){var a=el("a");a.href=SITE+n[0];a.target="_top";
  a.appendChild(el("span","vl",n[1]));a.appendChild(el("span","vs",n[2]));
  a.addEventListener("click",function(ev){if(inFrame&&connected){ev.preventDefault();send({type:"navigate",url:n[0]});}});return a;}
function renderNav(d){["navTop","navBot"].forEach(function(id){var nav=document.getElementById(id),row=nav.firstChild;row.innerHTML="";
  if(d.nav.prev)row.appendChild(navLink(d.nav.prev));row.appendChild(navLink(["/","Home","Home"]));if(d.nav.next)row.appendChild(navLink(d.nav.next));nav.hidden=false;});}

var coverImg=null,state={};
function cover(d,parent){
  if(NOCOVER){parent.className+=" nocover";
    if(d.peek){var pw=el("div","cover-wrap"),pp=el("button","peek","Peek Inside");pp.type="button";pp.id="peekBtn";pp.addEventListener("click",peek);pw.appendChild(pp);parent.appendChild(pw);}
    return;} /* &cover=0: a native Wix image above the embed shows the cover (fastest first paint) */
  var w=el("div","cover-wrap"),b=el(d.peek?"button":"div","cover");
  if(d.peek){b.type="button";b.setAttribute("aria-label","Peek inside "+d.title);b.addEventListener("click",peek);}
  coverImg=el("img");b.style.setProperty("--ar",d.ar||"1/1");
  setImg(coverImg,d.cover,d.alt,"(min-width:900px) 420px, 220px",[440,840],true);
  b.appendChild(coverImg);w.appendChild(b);
  if(d.peek){var pk=el("button","peek","Peek Inside");pk.type="button";pk.id="peekBtn";pk.addEventListener("click",peek);w.appendChild(pk);}
  parent.appendChild(w);
}
function peek(){send({type:"openPeekInside"});}
function placePeek(){
  var pk=document.getElementById("peekBtn"),wrap=document.querySelector(".cover-wrap"),hero=document.querySelector(".hero");
  if(!pk||!wrap)return;
  var phone=false;try{phone=window.matchMedia("(max-width:599px)").matches;}catch(e){}
  if(phone){if(hero&&pk.parentNode!==hero)hero.appendChild(pk);}
  else if(pk.parentNode!==wrap)wrap.appendChild(pk);
}

function render(s){
  slug=s;var d=PAGES[s];document.documentElement.setAttribute("data-page",s);document.title=d.title+" | Letters of My Heart";
  var page=document.getElementById("page");page.innerHTML="";
  var hero=el("div","hero");page.appendChild(hero);cover(d,hero);
  var col=el("div","buy");hero.appendChild(col);
  var tb=el("div","title-block");col.appendChild(tb);
  if(d.eyebrow)tb.appendChild(el("p","eyebrow",d.eyebrow));
  tb.appendChild(el("h1","",d.title));
  if(d.byline)tb.appendChild(el("p","byline",d.byline));
  if(d.foreword)tb.appendChild(el("p","foreword",d.foreword));
  if(d.tagline)tb.appendChild(el("p","tagline",d.tagline));
  if(d.fact)tb.appendChild(el("p","fact",d.fact));
  if(d.date)tb.appendChild(el("p","date",d.date));

  if(d.kind==="available"){
    var priceEl=el("p","price-sel");priceEl.id="selPrice";
    var meta=el("div","buy-meta");
    ["byline","foreword","fact"].forEach(function(c){var n=tb.querySelector("."+c);if(n)meta.appendChild(n);});
    meta.appendChild(priceEl);
    var h1el=tb.querySelector("h1");tb.insertBefore(meta,h1el?h1el.nextSibling:null);
    placePeek();
    col.appendChild(el("p","choose","Choose Your Edition"));
    var list=el("div","editions");list.setAttribute("role","radiogroup");list.setAttribute("aria-label","Choose Your Edition");col.appendChild(list);
    var variant=el("p","variant"),order=el("button","order"),xmas=el("p","xmas",XMAS),status=el("p","status"),note=el("p","note");
    order.type="button";order.id="orderBtn";status.hidden=true;status.setAttribute("aria-live","polite");
    var btns=d.choices.map(function(c){var b=el("button","edition");b.type="button";b.setAttribute("role","radio");b.dataset.id=c.id;
      b.appendChild(el("span","radio"));b.appendChild(el("span","ename",c.name));var ep=el("span","eprice");setPriceNode(ep,c.price,c.id);b.appendChild(ep);
      b.addEventListener("click",function(){pick(c);});list.appendChild(b);return b;});
    function pick(c){state.c=c;btns.forEach(function(b){b.setAttribute("aria-checked",b.dataset.id===c.id?"true":"false");});
      setPriceNode(priceEl,c.price,c.id,c.name+" ");
      variant.textContent=c.line;order.textContent=c.label||"Order Now";xmas.hidden=!c.ship;note.textContent=c.note||CHECKOUT_NOTE;
      var u=c.img||d.cover,alt=c.img?c.alt:d.alt;if(coverImg&&coverImg.dataset.u!==u){coverImg.dataset.u=u;setImg(coverImg,u,alt,"(min-width:900px) 420px, 220px",[440,840],true);
        coverImg.parentNode.style.setProperty("--ar",c.ar||d.ar||"1/1");}
      height();}
    order.addEventListener("click",function(){var c=state.c;if(!c)return;
      if(c.ext){window.open(c.ext,"_blank","noopener");return;}
      go(c.go);});
    col.appendChild(variant);col.appendChild(order);col.appendChild(xmas);col.appendChild(status);col.appendChild(note);
    var det=el("details","ship");det.appendChild(el("summary","","Shipping & Delivery"));var body=el("div","ship-body");
    SHIP.forEach(function(t){body.appendChild(el("p","",t));});det.appendChild(body);det.addEventListener("toggle",height);col.appendChild(det);
    pick(d.choices.filter(function(c){return c.dflt;})[0]||d.choices[0]);
    if(d.more){var mo=el("section","more");mo.appendChild(el("div","orn")).appendChild(el("span"));mo.appendChild(el("h2","",d.more.h));
      mo.appendChild(el("p","peek-cap",d.more.cap));var st=el("div","strip");
      d.more.imgs.forEach(function(i){var im=el("img");setImg(im,i[0],i[1],"(min-width:900px) 260px, 33vw",[260,520],false);st.appendChild(im);});
      mo.appendChild(st);mo.appendChild(el("div","orn")).appendChild(el("span"));d.more.about.forEach(function(t){mo.appendChild(el("p","",t));});page.appendChild(mo);}
  }else if(d.kind==="set"){
    if(d.eName)col.appendChild(el("p","choose",d.eName));
    var pb=el("p","price-big");setPriceNode(pb,d.price,"set");col.appendChild(pb);if(d.priceNote)col.appendChild(el("p","price-note",d.priceNote));
    if(d.line)col.appendChild(el("p","variant",d.line));
    var ob=el("button","order",d.label);ob.type="button";ob.id="orderBtn";ob.addEventListener("click",function(){go(d.go);});col.appendChild(ob);
    if(d.xmas)col.appendChild(el("p","xmas",XMAS));
    col.appendChild(el("p","note",CHECKOUT_NOTE));
    if(d.ship){var sd=el("details","ship");sd.appendChild(el("summary","","Shipping & Delivery"));var sb=el("div","ship-body");
      d.ship.forEach(function(t){sb.appendChild(el("p","",t));});sd.appendChild(sb);sd.addEventListener("toggle",height);col.appendChild(sd);}
  }else{
    var nb=el("button","order",state.notifyLabel||"Notify Me");nb.type="button";nb.id="notifyBtn";
    nb.addEventListener("click",function(){send({type:"openNotify",bookId:d.bookId});});
    var wrap=el("div");wrap.style.marginTop="14px";wrap.appendChild(nb);col.appendChild(wrap);
  }
  renderNav(d);height();
}
function height(){send({type:"height",px:Math.ceil(document.body.getBoundingClientRect().height),part:"main"});}

/* existing page code -> this frame */
window.addEventListener("message",function(ev){var m=ev.data;if(!m||typeof m!=="object"||m.source!==NS)return;
  if(m.type==="payload"){connected=true;P=m.payload||null;
    if(!slug&&P&&P.book){var s=BY_BOOK[P.book.bookId]||norm(P.book.slug);if(PAGES[s])render(s);}
    var lab=P&&P.settings&&P.settings.labels&&P.settings.labels.notifyButton;
    if(lab&&/on the list/i.test(lab)){state.notifyLabel=lab;var nb=document.getElementById("notifyBtn");if(nb)nb.textContent=lab;}
    if(m.peekInside===false){var pk=document.getElementById("peekBtn");if(pk)pk.hidden=true;}
  }
  if(m.type==="cartResult"&&m.message){var st=document.querySelector(".status");if(st){st.hidden=false;st.textContent=m.message;}}
});

function saleMessage(raw){
  var m=raw;
  if(typeof m==="string"){try{m=JSON.parse(m);}catch(e){return null;}}
  if(m&&typeof m==="object"&&m.data&&typeof m.data==="object"&&m.data.type==="lomhSale")m=m.data;
  if(!m||typeof m!=="object"||m.type!=="lomhSale")return null;
  return m;
}
window.addEventListener("message",function(ev){
  var m=saleMessage(ev.data);
  if(!m)return;
  var nextOn=!!(m.on&&typeof m.percent==="number");
  var nextPct=nextOn?m.percent:0;
  if(nextOn===saleOn&&nextPct===salePct)return;
  saleOn=nextOn;salePct=nextPct;
  if(slug)render(slug);
});
function askSale(){send({type:"lomhSaleAsk"});}
var s=detect();if(s)render(s);
askSale();
send({type:"ready"});
[800,2500,6000].forEach(function(t){setTimeout(function(){if(!connected)send({type:"ready"});if(!saleOn)askSale();},t);});
window.addEventListener("load",height);window.addEventListener("resize",function(){placePeek();height();});
})();
</script>
</body>
</html>
